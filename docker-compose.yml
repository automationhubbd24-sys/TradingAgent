services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradingagents
      POSTGRES_USER: tradingagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingagents -d tradingagents"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://tradingagents:${POSTGRES_PASSWORD:-change-me}@postgres:5432/tradingagents
    command: ["sh", "-c", "alembic upgrade head && uvicorn web.backend.app:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://tradingagents:${POSTGRES_PASSWORD:-change-me}@postgres:5432/tradingagents
    command: ["sh", "-c", "alembic upgrade head && echo 'worker readiness: no queue configured' && tail -f /dev/null"]
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://tradingagents:${POSTGRES_PASSWORD:-change-me}@postgres:5432/tradingagents
    command: ["sh", "-c", "alembic upgrade head && echo 'scheduler readiness: no schedule configured' && tail -f /dev/null"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
